server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Angular client-side routing ──────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html,
    # which lets Angular's router take over (e.g. /home, /students/dues).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ────────────────────────────────────────────────
    # Requests to /api/* are forwarded to the Spring Boot backend container.
    # The trailing slash on proxy_pass strips the /api prefix before forwarding.
    # This means /api/auth/login → http://server:8080/auth/login
    # Benefit: browser never talks to port 8080 directly — CORS is eliminated.
    location /api/ {
        proxy_pass         http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
