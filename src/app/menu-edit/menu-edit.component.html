<div class="page-container">
  <mat-card class="header-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>restaurant_menu</mat-icon>
      <mat-card-title>Weekly Menu Editor</mat-card-title>
      <mat-card-subtitle>Click the edit icon on any meal slot to update its name or description.</mat-card-subtitle>
    </mat-card-header>
  </mat-card>

  <div *ngIf="isLoading" class="spinner-wrap">
    <mat-progress-spinner mode="indeterminate" diameter="56"></mat-progress-spinner>
  </div>

  <mat-accordion *ngIf="!isLoading" class="days-accordion" multi>
    <mat-expansion-panel *ngFor="let day of days" class="day-panel">
      <mat-expansion-panel-header>
        <mat-panel-title class="day-title">
          <mat-icon class="day-icon">calendar_today</mat-icon>
          {{ day | titlecase }}
        </mat-panel-title>
        <mat-panel-description>{{ menuByDay[day]?.length || 0 }} meal slots</mat-panel-description>
      </mat-expansion-panel-header>

      <table mat-table [dataSource]="menuByDay[day]" class="menu-table">

        <!-- Meal Type chip -->
        <ng-container matColumnDef="mealType">
          <th mat-header-cell *matHeaderCellDef>Meal</th>
          <td mat-cell *matCellDef="let item">
            <mat-chip [style.background-color]="getColor(item.mealType)" class="meal-chip">
              {{ item.mealType | titlecase }}
            </mat-chip>
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let item">
            <span *ngIf="!item.editing" class="item-name">{{ item.name }}</span>
            <mat-form-field *ngIf="item.editing" appearance="outline" class="edit-field" [formGroup]="item.form">
              <mat-label>Name</mat-label>
              <input matInput formControlName="name">
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let item">
            <span *ngIf="!item.editing" class="item-desc">{{ item.description }}</span>
            <mat-form-field *ngIf="item.editing" appearance="outline" class="edit-field-wide" [formGroup]="item.form">
              <mat-label>Description</mat-label>
              <textarea matInput formControlName="description" rows="2"></textarea>
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item">
            <ng-container *ngIf="!item.editing">
              <button mat-icon-button color="primary" (click)="startEdit(item)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
            </ng-container>
            <ng-container *ngIf="item.editing">
              <button mat-icon-button color="primary" (click)="save(item)" [disabled]="item.form.invalid" matTooltip="Save">
                <mat-icon>check</mat-icon>
              </button>
              <button mat-icon-button (click)="cancelEdit(item)" matTooltip="Cancel">
                <mat-icon>close</mat-icon>
              </button>
            </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let r; columns: columns;" [class.editing-row]="r.editing"></tr>
      </table>
    </mat-expansion-panel>
  </mat-accordion>
</div>
