<div class="page-container">
  <mat-card>
    <mat-card-header>
      <mat-icon mat-card-avatar>price_change</mat-icon>
      <mat-card-title>Meal Price Management</mat-card-title>
      <mat-card-subtitle>Click the edit icon to update a meal price. Changes affect all future calculations.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="isLoading" class="spinner-wrap">
        <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
      </div>

      <table mat-table [dataSource]="prices" *ngIf="!isLoading" class="price-table">

        <!-- Icon -->
        <ng-container matColumnDef="icon">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <mat-icon class="meal-icon">{{ mealIcons[row.mealType] }}</mat-icon>
          </td>
        </ng-container>

        <!-- Meal Type -->
        <ng-container matColumnDef="meal">
          <th mat-header-cell *matHeaderCellDef>Meal</th>
          <td mat-cell *matCellDef="let row">
            <span class="meal-label">{{ row.mealType | titlecase }}</span>
          </td>
        </ng-container>

        <!-- Price -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price (₹)</th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="!row.editing" class="price-badge">₹{{ row.priceInr }}</span>
            <form *ngIf="row.editing" [formGroup]="row.form" class="inline-form">
              <mat-form-field appearance="outline" class="price-field">
                <mat-label>New Price</mat-label>
                <span matPrefix>₹&nbsp;</span>
                <input matInput type="number" formControlName="priceInr" min="1">
              </mat-form-field>
            </form>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <ng-container *ngIf="!row.editing">
              <button mat-icon-button color="primary" (click)="startEdit(row)" matTooltip="Edit price">
                <mat-icon>edit</mat-icon>
              </button>
            </ng-container>
            <ng-container *ngIf="row.editing">
              <button mat-icon-button color="primary" (click)="save(row)" [disabled]="row.form.invalid" matTooltip="Save">
                <mat-icon>check</mat-icon>
              </button>
              <button mat-icon-button (click)="cancelEdit(row)" matTooltip="Cancel">
                <mat-icon>close</mat-icon>
              </button>
            </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.editing-row]="row.editing"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
